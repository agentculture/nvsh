[project]
name = "nvsh"
version = "0.14.3"
description = "nvsh: an agent-first shell for NVIDIA Jetson, DGX Spark and RTX Spark. Runs your commands like a normal shell; when a command fails, it hands the error and context to an agent (shell -> agent) to diagnose and propose a fix."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{name = "AgentCulture"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development",
    "Intended Audience :: Developers",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/agentculture/nvsh"
Issues = "https://github.com/agentculture/nvsh/issues"

[project.scripts]
nvsh = "nvsh.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nvsh"]
include = ["nvsh/shell/*.bash", "nvsh/agent/pi_ext/*.ts", "nvsh/agent/*.json", "nvsh/tiers/*.json"]
# The bash integration, the pi approval extension, the demo adapter's
# fixture and the tier fetch pins are data, not Python: name them
# explicitly or hatchling leaves them out of the wheel.
artifacts = ["nvsh/shell/*.bash", "nvsh/agent/pi_ext/*.ts", "nvsh/agent/*.json", "nvsh/tiers/*.json"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "pytest-cov>=4.1",
    "bandit>=1.7.5",
    "flake8>=6.1",
    "isort>=5.12.0",
    "black>=23.7.0",
    "teken>=0.8",
    "pyyaml>=6.0",
]

[tool.coverage.run]
source = ["nvsh"]
omit = ["nvsh/__pycache__/*"]
# Emit repo-relative paths in coverage.xml so SonarCloud maps them to
# sonar.sources=nvsh (absolute/.venv paths fail to map → empty coverage).
relative_files = true

[tool.coverage.report]
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["nvsh"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B404", "B603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
