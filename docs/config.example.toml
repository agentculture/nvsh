# Example nvsh config.
#
# Copy to $XDG_CONFIG_HOME/nvsh/config.toml (defaults to the user's config
# directory, nvsh/config.toml under .config, when $XDG_CONFIG_HOME is unset)
# and edit. A missing file is equivalent to
# every value below at its default — nvsh never requires this file to exist.
#
# nvsh never reads or stores a literal API key. Backends that need one
# configure `api_key_env`, the NAME of an environment variable nvsh reads at
# call time — never a key value. Setting `api_key` directly is rejected.
#
# Unknown keys (a typo, a stale option) are rejected loudly at load time
# rather than silently ignored.

[agent]
# Which entry under [agents.*] below is active. Default: "pi".
provider = "pi"

[agents.pi]
# The Pi/associate backend: a local Culture-mesh agent driving Nemotron.
provider = "nemotron"
model = "associate"

[agents.openai-compat]
# An OpenAI-compatible HTTP backend (local vLLM / llama.cpp server, or a
# hosted API reached through a local proxy). base_url must be localhost —
# nvsh is offline-first; a non-localhost endpoint here is out of scope for
# this example.
base_url = "http://localhost:8000/v1"
api_key_env = "NVSH_API_KEY"

[sessions]
# Maximum number of concurrent agent sessions this nvsh process holds open.
max = 1

[triggers]
# How often (seconds) an automatic (non-manual) agent call is allowed to
# fire, and which opt-in pattern triggers are enabled (see CLAUDE.md's
# "Behavior rules" section — pattern triggers for tools that print an error
# and still exit 0 are opt-in, never on by default).
rate_window_seconds = 60
opt_in_patterns = []
