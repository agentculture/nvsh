# Example nvsh config.
#
# Copy to $XDG_CONFIG_HOME/nvsh/config.toml (defaults to the user's config
# directory, nvsh/config.toml under .config, when $XDG_CONFIG_HOME is unset)
# and edit. A missing file is equivalent to
# every value below at its default — nvsh never requires this file to exist.
#
# nvsh never reads or stores a literal API key. Backends that need one
# configure `api_key_env`, the NAME of an environment variable nvsh reads at
# call time, or `api_key_file`, the PATH of a file holding the key — never a
# key value. Setting `api_key` directly is rejected.
#
# Unknown keys (a typo, a stale option) are rejected loudly at load time
# rather than silently ignored.
#
# Redaction runs before anything reaches any of these backends: nvsh never
# edits, creates or overrides a harness's own settings or trust files
# (agy/claude settings.json, codex config.toml, kiro trust settings, qwen
# settings) -- it only passes the launch flags and protocol-level policy
# shown below, and reports what it finds. See CLAUDE.md's "Device context,
# with redaction always on" and nvsh/redact.py.

[agent]
# Which entry under [agents.*] below is active. Default: "pi".
provider = "pi"

[agents.pi]
# The Pi/associate backend: a local Culture-mesh agent driving Nemotron.
provider = "nemotron"
model = "associate"

[agents.openai-compat]
# An OpenAI-compatible HTTP backend (local vLLM / llama.cpp server, or a
# hosted API reached through a local proxy). base_url must be localhost —
# nvsh is offline-first; a non-localhost endpoint here is out of scope for
# this example.
base_url = "http://localhost:8000/v1"
#
# Bearer resolution order, first hit wins:
#   1. api_key_env — this environment variable, when it is set and non-empty
#      in the shell that failed. Nothing exports it for you: an interactive
#      shell only has it if your rc file or systemd unit sets it.
#   2. api_key_file — a file holding the key, `~` and `$XDG_CONFIG_HOME`
#      expanded. Must be mode 0600; nvsh refuses a file other users can read
#      and says so (naming the file and its mode, never the key).
#   3. the default key file, $XDG_CONFIG_HOME/nvsh/api_key (mode 0600), when
#      it exists — the simplest place to put a gateway key:
#        install -m 600 /dev/null "$XDG_CONFIG_HOME/nvsh/api_key"
#        printf %s "<key>" > "$XDG_CONFIG_HOME/nvsh/api_key"
#   4. nothing — the request goes out with no Authorization header.
api_key_env = "NVSH_API_KEY"
# api_key_file = "$XDG_CONFIG_HOME/nvsh/api_key"

[agents.claude]
# A harness-backend example: effort, extra_args and approval are per-harness
# knobs (task t5). effort and model are opaque strings nvsh never validates
# against an enum -- pass whatever the backend itself accepts. approval is
# checked against a fixed two-value set because it picks a code path:
#   "nvsh"    -- nvsh's own approval prompt gates every proposed fix (default
#                behavior described in CLAUDE.md's "Propose, don't run").
#   "harness" -- the harness's own approval/sandbox flow gates it instead.
provider = "claude"
model = "sonnet"
effort = "high"
extra_args = ["--dangerously-skip-permissions"]
approval = "harness"

# [aliases] maps a short name to a 'backend[/model[/effort]]' target (1-3
# non-empty '/'-separated segments; model and effort are optional). A
# literal target of the same shape also resolves directly, without being
# registered here -- e.g. `nvsh --agent claude/sonnet/medium` or, with a
# leading '@' to make the "this is a target, not an alias" intent explicit,
# `nvsh --agent @claude/sonnet/medium`.
#
# 'default' is reserved: it is what a bare `nvsh --agent default` (or no
# --agent at all) resolves to. When [aliases].default is absent, 'default'
# falls back to [agent] provider above and that backend's configured model,
# with no effort. `nvsh agent use <name>` (set_provider) keeps writing
# [agent] provider for backward compatibility and now also writes
# [aliases].default = <name>.
[aliases]
default = "pi"
reviewer = "claude/opus/high"
local = "pi"

[sessions]
# Maximum number of concurrent agent sessions this nvsh process holds open.
max = 1

[triggers]
# How often (seconds) an automatic (non-manual) agent call is allowed to
# fire, and which opt-in pattern triggers are enabled (see CLAUDE.md's
# "Behavior rules" section — pattern triggers for tools that print an error
# and still exit 0 are opt-in, never on by default).
rate_window_seconds = 60
opt_in_patterns = []

# [tiers]
# Local response tiers (nvsh[needle], nvsh[lfm]). Routing is off until
# enabled = true.
# enabled = false                           # turn on tiers routing
# needle_min_confidence = 0.0               # minimum confidence for needle match
# memory_floor_mb = 1024                    # free memory threshold (MiB)
# idle_unload_seconds = 900                 # idle time before unloading
# records_cap_mb = 8                        # disk cap for tier records (MiB)
# store_request_text = false                # persist full request text
#
# [tiers.lfm]
# engine = "llama-server"                   # llama-server | vllm | sglang
# mode = "managed"                          # managed | attach
# base_url = "http://127.0.0.1:8080/v1"    # localhost URL for the LFM engine
# model = ""                                # model name (optional)
