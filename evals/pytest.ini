[pytest]
# --import-mode=importlib: evals/tool_jev/tests has no __init__.py by design
# (each later task adds just its own module + test file, no package
# boilerplate), so pytest must not fall back to rootdir-relative import,
# which would collide on same-named test files across future provider dirs.
# -p no:deepeval: deepeval's pytest11 plugin would import deepeval (and load a
# stray .env) before collection reaches evals.tool_jev's guard. The suite uses
# deepeval's Python API (evaluate()), never its pytest plugin.
addopts = -ra --import-mode=importlib -p no:deepeval
#
# testpaths is relative to the rootdir, and it is only honored by pytest
# when invocation_dir == rootdir (see _pytest.config.Config._decide_args) —
# otherwise pytest silently falls back to scanning the invocation dir. Run
# this suite from the repo root (so `uv run` finds pyproject.toml) with
# `--rootdir=.` so rootdir == invocation dir == repo root, hence the path
# below is repo-root-relative, not relative to this file's own directory:
#
#   uv run pytest -c evals/pytest.ini --rootdir=. -q
#
# (running with cwd already inside evals/ also works without --rootdir=.,
# but then this path must be "tool_jev/tests" instead — repo-root-relative
# is the one CI and `uv run` from the repo root both need.)
testpaths = evals/tool_jev/tests
