# ---------------------------------------------------------------------------
# Case sets. The issue-53 sets are sendable to providers; the heldout sets
# are saved-only and flagged include_heldout so a runner never sends them.
# Counts here mirror the issue-53 sets; the heldout counts are placeholders.
# ---------------------------------------------------------------------------

[[case_set]]
name = "issue-53-test"
count = 198
split = "test"
path = "splits/issue-53-test.json"
include_heldout = false

[[case_set]]
name = "issue-53-missing-candidate"
count = 83
split = "test-mc"
path = "splits/issue-53-missing-candidate.json"
include_heldout = false

[[case_set]]
name = "heldout-track-a"
count = 40
split = "heldout"
path = "splits/heldout-track-a.json"
include_heldout = true

[[case_set]]
name = "heldout-track-b"
count = 40
split = "heldout-mc"
path = "splits/heldout-track-b.json"
include_heldout = true

