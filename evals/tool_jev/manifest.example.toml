# Example run manifest for the tool_jev DeepEval release gate (issue #64).
#
# This file is committed and MUST stay free of private paths (no absolute
# path, no `~`/`$HOME`-shaped path) and free of non-localhost URLs — see
# scripts/scan-secrets.py and evals/tool_jev/tests/test_manifest.py.
#
# The operator's real manifest is a private file living outside this repo
# (in the operator's lfm-train work tree), never at a hard-coded path.
# Point NVSH_EVALS_MANIFEST at it:
#
#   export NVSH_EVALS_MANIFEST=/path/outside/this/repo/manifest.toml
#
# `${NVSH_EVALS_PRIVATE}` below is a literal placeholder string, not a real
# path: the operator's own manifest resolves it to wherever saved
# predictions live on their machine. This module (evals/tool_jev/manifest.py)
# does not expand it — it is only ever a plain string field.
#
# Each [[case_set]]'s `path` is different: it is a plain path RELATIVE to a
# private data root the caller supplies out of band (the
# NVSH_EVALS_PRIVATE_ROOT environment variable), resolved by
# evals/tool_jev/cases.py's case_sets_from_manifest — never absolute, never
# home-shaped (`~`), and never a `${...}`-style placeholder. manifest.py
# rejects any [[case_set]] whose path breaks that rule.
#
# Every list below is an array-of-tables ([[...]]). Adding a checkpoint, a
# reference model, a judge or a case set is a data change here — no code
# change to manifest.py or any runner that consumes it.

# ---------------------------------------------------------------------------
# Track A (generative): a3-heal candidate vs. the stock baseline.
# ---------------------------------------------------------------------------

[[candidate]]
name = "a3-heal.q4_k_m"
track = "A"
predictions_path = "${NVSH_EVALS_PRIVATE}/predictions/a3-heal.q4_k_m.jsonl"
# train_split names this checkpoint's own training-side split file, so a
# runner can refuse (cases.training_overlap) to score it on an id it was
# trained on. Optional -- a reference model with no local training split
# simply omits it, as the entries below do.
train_split = "${NVSH_EVALS_PRIVATE}/splits/a3-heal.q4_k_m.train.json"

[[baseline]]
name = "stock"
track = "A"
predictions_path = "${NVSH_EVALS_PRIVATE}/predictions/stock.jsonl"

# ---------------------------------------------------------------------------
# Track B (scorer): scorer-r3b candidate vs. the scorer-b1 baseline.
# ---------------------------------------------------------------------------

[[candidate]]
name = "scorer-r3b.q4_k_m"
track = "B"
predictions_path = "${NVSH_EVALS_PRIVATE}/predictions/scorer-r3b.q4_k_m.jsonl"

[[baseline]]
name = "scorer-b1"
track = "B"
predictions_path = "${NVSH_EVALS_PRIVATE}/predictions/scorer-b1.jsonl"

# ---------------------------------------------------------------------------
# Reference roster: 16 (provider, model) pairs. Uniqueness is on the pair,
# not on model id alone (the same model may appear under two providers).
# OpenRouter carries the cheaper open models (deviation d3, 2026-09-26):
# kimi-k3 runs on build.nvidia.com only; qwen3.8-max-0902 stays, as a
# reference and a judge (every judge also answers). api_key_env names the environment variable that
# holds the credential; the value itself never lives here.
# ---------------------------------------------------------------------------

[[reference]]
provider = "openai"
model = "gpt-6-luna"
reasoning = "medium"
batch = true
capabilities = ["chat"]
api_key_env = "OPENAI_API_KEY"

